<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poyezdlar jadvali — O'zbekiston</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Майолика Регистана: глубокий сине-зелёный по светлой бумаге,
       бирюза плитки для акцента, шафран только для срочного. */
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ink:#16323B;
    --muted:#63797F;
    --rule:#DBE2E1;
    --tile:#1B8794;
    --saffron:#C4841F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    min-height:100vh;
    padding:clamp(14px,3.5vw,36px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto}

  /* ---- шапка ---- */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;padding-bottom:16px;
  }
  .place{
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:clamp(26px,6.5vw,40px);
    letter-spacing:-.02em;
    line-height:1;
  }
  .place span{color:var(--muted);font-weight:400}

  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .langs{display:flex;gap:2px}
  .langs button{
    background:none;border:0;color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11px;font-weight:600;letter-spacing:.1em;
    padding:4px 7px;border-radius:3px;transition:.16s;
  }
  .langs button:hover{color:var(--ink)}
  .langs button[aria-pressed="true"]{color:var(--card);background:var(--tile)}
  .langs button:focus-visible{outline:2px solid var(--tile);outline-offset:2px}

  .clock{
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(20px,5vw,28px);font-weight:500;
    font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  }
  .clock small{
    display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase;margin-top:5px;
    font-family:'IBM Plex Sans',sans-serif;
  }

  /* ---- города ---- */
  .cities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cities button{
    background:var(--card);border:1px solid var(--rule);color:var(--muted);
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;font-weight:500;padding:7px 13px;border-radius:20px;
    transition:.16s;
  }
  .cities button:hover{border-color:var(--tile);color:var(--ink)}
  .cities button[aria-pressed="true"]{
    background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600;
  }
  .cities button:focus-visible{outline:2px solid var(--tile);outline-offset:2px}

  /* ---- направление ---- */
  .modes{display:flex;gap:0;margin-bottom:6px;border-bottom:2px solid var(--rule)}
  .modes button{
    background:none;border:0;color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;
    padding:9px 2px;margin-right:22px;position:relative;top:2px;
    border-bottom:2px solid transparent;transition:.16s;
  }
  .modes button:hover{color:var(--ink)}
  .modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--tile)}
  .modes button:focus-visible{outline:2px solid var(--tile);outline-offset:3px}

  /* ---- табло ---- */
  .board{margin-top:14px;min-height:120px}
  .row{
    display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--rule);border-radius:8px;
    padding:14px 16px;margin-bottom:7px;position:relative;overflow:hidden;
    animation:in .4s both;
  }
  .row:nth-child(1){animation-delay:.02s} .row:nth-child(2){animation-delay:.06s}
  .row:nth-child(3){animation-delay:.10s} .row:nth-child(4){animation-delay:.14s}
  .row:nth-child(5){animation-delay:.18s} .row:nth-child(6){animation-delay:.22s}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Подпись: рельс у нижней кромки. Заполняется по мере приближения
     отправления и виден только в последний час — до того он молчит. */
  .rail{
    position:absolute;left:0;bottom:0;height:2px;
    background:var(--tile);opacity:.55;
  }
  .rail.soon{background:var(--saffron);opacity:1}

  .num{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;
    color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .dest{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
  .brand{
    display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tile);border:1px solid var(--tile);border-radius:3px;
    padding:2px 5px;margin-right:7px;vertical-align:1px;font-weight:600;
  }
  .brand.fast{color:var(--card);background:var(--tile)}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .meta b{color:var(--ink);font-weight:600}

  .right{text-align:right;min-width:96px}
  .time{
    font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;
  }
  .in{
    font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px;
    color:var(--muted);margin-top:5px;
  }
  .in b{font-weight:600;color:var(--tile);font-variant-numeric:tabular-nums}
  .in.soon b{color:var(--saffron)}
  .dev{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--saffron);margin-top:3px;
  }
  .platform{
    display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--card);background:var(--ink);padding:3px 7px;border-radius:3px;
    margin-top:6px;font-weight:600;
  }
  .st-tag{color:var(--muted)}

  /* ---- маршрут ---- */
  .row.open{grid-template-areas:none;cursor:default}
  .row[role="button"]{cursor:pointer}
  .row[role="button"]:hover{border-color:var(--tile)}
  .row[role="button"]:focus-visible{outline:2px solid var(--tile);outline-offset:2px}

  .route-wrap{grid-column:1/-1;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}

  .route{list-style:none;position:relative;padding-left:18px}
  /* Нитка маршрута: линия сквозь все остановки. */
  .route::before{
    content:'';position:absolute;left:4px;top:7px;bottom:7px;
    width:1px;background:var(--rule);
  }
  .route li{
    display:flex;align-items:baseline;gap:10px;padding:5px 0;
    font-size:13px;position:relative;
  }
  .route li::before{
    content:'';position:absolute;left:-18px;top:10px;
    width:7px;height:7px;border-radius:50%;
    background:var(--card);border:1.5px solid var(--rule);
  }
  .route li.here::before{background:var(--tile);border-color:var(--tile)}
  .route li.here .rn{font-weight:600;color:var(--ink)}

  .rt{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;min-width:96px;
  }
  .rn{color:var(--muted)}
  .stop{
    font-size:10px;color:var(--muted);border:1px solid var(--rule);
    border-radius:3px;padding:1px 5px;margin-left:auto;white-space:nowrap;
  }
  .cut{font-size:11px;color:var(--muted);margin-top:8px;padding-left:18px}

  .empty{
    background:var(--card);border:1px solid var(--rule);border-radius:8px;
    padding:26px 20px;color:var(--muted);font-size:14px;line-height:1.6;
  }

  footer{
    margin-top:20px;font-size:12px;line-height:1.6;color:var(--muted);
    border-top:1px solid var(--rule);padding-top:13px;
  }

  @media (max-width:480px){
    .row{grid-template-columns:46px 1fr auto;gap:10px;padding:12px 13px}
    .num{font-size:13px} .dest{font-size:14px} .time{font-size:19px}
    .modes button{margin-right:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .row{animation:none} *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="place" id="place"></div>
    <div class="head-right">
      <div class="langs" id="langs" role="group" aria-label="Til / Language"></div>
      <div class="clock"><span id="clock">--:--:--</span><small id="tz-label"></small></div>
    </div>
  </header>

  <div class="modes" role="group" aria-label="Направление">
    <button id="btn-dep" aria-pressed="true"></button>
    <button id="btn-arr" aria-pressed="false"></button>
  </div>

  <div class="cities" id="cities" role="group" aria-label="Город"></div>

  <div class="board" id="board"></div>

  <footer id="foot"></footer>

</div>

<script>
const TZ_OFFSET = 5;          // Ташкент, UTC+5, перевода часов нет
const SHOW = 6;

let DATA = null;
let mode = 'departure';

const T = {
  uz: {abroad:'Keyin yo\'nalish O\'zbekistondan tashqarida davom etadi', track:'yo\'l', tz:'mahalliy vaqt', dep:'Jo\'nash', arr:'Kelish', through:'o\'tuvchi',
       tomorrow:'ertaga', inPrefix:'', min:'daq', hr:'soat', leaving:'jo\'namoqda',
       from:c => c + 'dan', empty:'Yaqin sutkada bu yo\'nalishda reyslar yo\'q.',
       error:'Jadval yuklanmadi. Sahifani yangilang.',
       note:'Jadval bo\'yicha vaqt. Kechikishlar hisobga olinmagan.',
       updated:d => 'Yangilangan ' + d},
  ru: {abroad:'Дальше маршрут идёт за пределами Узбекистана', track:'путь', tz:'время местное', dep:'Отправление', arr:'Прибытие', through:'проходящий',
       tomorrow:'завтра', inPrefix:'через', min:'мин', hr:'ч', leaving:'отправляется',
       from:c => 'из ' + c, empty:'В ближайшие сутки рейсов по этому направлению нет.',
       error:'Расписание не загрузилось. Обновите страницу.',
       note:'Время по расписанию. Задержки не учитываются.',
       updated:d => 'Обновлено ' + d},
  en: {abroad:'The route continues outside Uzbekistan', track:'track', tz:'local time', dep:'Departures', arr:'Arrivals', through:'through train',
       tomorrow:'tomorrow', inPrefix:'in', min:'min', hr:'h', leaving:'departing',
       from:c => 'from ' + c, empty:'No trains in this direction within 24 hours.',
       error:'Schedule failed to load. Please refresh.',
       note:'Scheduled times. Delays are not reflected.',
       updated:d => 'Updated ' + d},
};

let lang = 'uz';                      // по умолчанию узбекский

let NAMES = {};                       // ru -> {ru, uz, en}
let LIVE = {};                        // станция -> живые отправления
let ROUTES = {};                      // цифры номера -> маршрут
let openRow = null;                   // какой рейс раскрыт

const routeOf = t => ROUTES[(t.number.match(/^\d+/) || [''])[0]] || null;

/* Строка живого табло для рейса: платформа и отклонение по времени. */
function liveOf(t){
  const rows = LIVE[t.station];
  if (!rows || t.direction !== 'departure') return null;
  const digits = (t.number.match(/^\d+/) || [''])[0];
  return rows.find(r => (r.number.match(/^\d+/) || [''])[0] === digits &&
                        (r.time_local === t.time_local || r.planned === t.time_local)) || null;
}
const cityName = ru => (NAMES[ru] && NAMES[ru][lang]) || ru;

/* Уточнение вокзала внутри города: Ташкент-Южный, Бухара 1 */
const QUAL = {
  central: {ru:'Центральный', uz:'Markaziy', en:'Central'},
  south:   {ru:'Южный',       uz:'Janubiy',  en:'South'},
  north:   {ru:'Северный',    uz:'Shimoliy', en:'North'},
  pass:    {ru:'Пасс.',       uz:'Pass.',    en:'Pass.'},
};

function withQual(city, q){
  if (!q) return city;
  if (/^\d+$/.test(q)) return city + ' ' + q;      // «Бухара 1»
  const label = QUAL[q] && QUAL[q][lang];
  return label ? city + '-' + label : city;
}

const STATION_CODE = {
  'tashkent-central':'2900001', 'tashkent-south':'2900002',
  'samarkand':'2900700', 'bukhara':'2900800', 'navoi':'2900930',
  'jizzakh':'2900720', 'gulistan':'2900850', 'qarshi':'2900750',
  'andijan':'2900680', 'namangan':'2900940', 'kokand':'2900880',
  'margilan':'2900920', 'urgench':'2900790', 'khiva':'2900172',
  'nukus':'2900970',
};

const STATION_LABEL = {
  'tashkent': {ru:'Ташкент', uz:'Toshkent', en:'Tashkent'},
  'tashkent-central': {ru:'Ташкент-Центральный', uz:'Toshkent-Markaziy', en:'Tashkent-Central'},
  'tashkent-south': {ru:'Ташкент-Южный', uz:'Toshkent-Janubiy', en:'Tashkent-South'},
  'navoi': {ru:'Навои', uz:'Navoiy', en:'Navoi'},
  'jizzakh': {ru:'Джизак', uz:'Jizzax', en:'Jizzakh'},
  'gulistan': {ru:'Гулистан', uz:'Guliston', en:'Gulistan'},
  'kattakurgan': {ru:'Каттакурган', uz:'Kattaqoʻrgʻon', en:'Kattakurgan'},
  'kyzyltepa': {ru:'Кызылтепа', uz:'Qiziltepa', en:'Kyzyltepa'},
  'dashtobod': {ru:'Даштобод', uz:'Dashtobod', en:'Dashtobod'},
  'namangan': {ru:'Наманган', uz:'Namangan', en:'Namangan'},
  'kokand': {ru:'Коканд', uz:'Qoʻqon', en:'Kokand'},
  'margilan': {ru:'Маргилан', uz:'Margʻilon', en:'Margilan'},
  'pap': {ru:'Пап', uz:'Pop', en:'Pop'},
  'chartak': {ru:'Чартак', uz:'Chortoq', en:'Chartak'},
  'chust': {ru:'Чуст', uz:'Chust', en:'Chust'},
  'angren': {ru:'Ангрен', uz:'Angren', en:'Angren'},
  'kuva': {ru:'Кува', uz:'Quva', en:'Kuva'},
  'altyaryk': {ru:'Алтыарык', uz:'Oltiariq', en:'Oltiariq'},
  'khiva': {ru:'Хива', uz:'Xiva', en:'Khiva'},
  'shavat': {ru:'Шават', uz:'Shovot', en:'Shovot'},
  'khazarasp': {ru:'Хазарасп', uz:'Hazorasp', en:'Khazarasp'},
  'nukus': {ru:'Нукус', uz:'Nukus', en:'Nukus'},
  'kungrad': {ru:'Кунград', uz:'Qoʻngʻirot', en:'Kungrad'},
  'denau': {ru:'Денау', uz:'Denov', en:'Denau'},
  'kumkurgan': {ru:'Кумкурган', uz:'Qumqoʻrgʻon', en:'Kumkurgan'},
  'sariosiyo': {ru:'Сарыасия', uz:'Sariosiyo', en:'Sariosiyo'},
  'kitab': {ru:'Китаб', uz:'Kitob', en:'Kitab'},
  'tukimachi': {ru:'Тукимачи', uz:'Toʻqimachi', en:'Tukimachi'},
  'samarkand': {ru:'Самарканд', uz:'Samarqand', en:'Samarkand'},
  'bukhara':   {ru:'Бухара', uz:'Buxoro', en:'Bukhara'},
  'qarshi':    {ru:'Карши', uz:'Qarshi', en:'Karshi'},
  'urgench':   {ru:'Ургенч', uz:'Urganch', en:'Urgench'},
  'andijan':   {ru:'Андижан', uz:'Andijon', en:'Andijan'},
};
const stationName = id => (STATION_LABEL[id] && STATION_LABEL[id][lang]) || id;

/* Города собираются из самих данных: что пришло в schedule.json, то и
   показываем. Ташкентские вокзалы сливаются в один город. */
let CITIES = [];

function buildCityList(trains){
  const count = {};
  trains.forEach(t => {
    const id = t.station.startsWith('tashkent') ? 'tashkent' : t.station;
    count[id] = (count[id] || 0) + 1;
  });

  CITIES = Object.keys(count)
    .sort((a, b) => (a === 'tashkent' ? -1 : b === 'tashkent' ? 1 : count[b] - count[a]))
    .map(id => ({
      id,
      ru: (STATION_LABEL[id] && STATION_LABEL[id].ru) || id,
      match: id === 'tashkent' ? s => s.startsWith('tashkent') : s => s === id,
    }));
}
let city = null;

/* ---- время в Ташкенте независимо от часового пояса устройства ---- */
function tashkentNow(){
  const d = new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset() + TZ_OFFSET * 60) * 60000);
}

const pad = n => String(n).padStart(2,'0');

/* ---- ближайшие рейсы с учётом дней курсирования и перехода через полночь ---- */
function upcoming(trains, direction){
  const now = tashkentNow();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const isoDay = d => d.getDay() === 0 ? 7 : d.getDay();   // 1=Пн … 7=Вс
  const out = [];

  for (const dayShift of [0, 1]){                          // сегодня и завтра
    const day = new Date(now.getTime() + dayShift * 86400000);
    for (const t of trains){
      if (t.direction !== direction) continue;
      if (!city.match(t.station)) continue;
      if (!runsOn(t.days, day)) continue;

      const [h, m] = t.time_local.split(':').map(Number);
      const mins = h * 60 + m;
      if (dayShift === 0 && mins < nowMin) continue;       // уже ушёл

      out.push({...t, tomorrow: dayShift === 1, at: dayShift * 1440 + mins - nowMin});
    }
  }
  return out.sort((a,b) => a.at - b.at).slice(0, SHOW);
}

/* дни курсирования: '1234567' по дням недели, либо 'even'/'odd' по числу месяца */
function runsOn(days, date){
  if (days === 'even') return date.getDate() % 2 === 0;
  if (days === 'odd')  return date.getDate() % 2 === 1;
  const iso = date.getDay() === 0 ? 7 : date.getDay();
  return days.includes(String(iso));
}

function countdownText(mins){
  const t = T[lang];
  if (mins <= 0) return {text:t.leaving, soon:true};
  if (mins < 60) return {text:`${mins} ${t.min}`, soon:mins <= 15};
  return {text:`${Math.floor(mins/60)} ${t.hr} ${pad(mins%60)} ${t.min}`, soon:false};
}

/* Заголовок рейса: по-русски берём готовый (там падеж), иначе собираем. */
/* Маршрут под строкой. Текущая станция подсвечена: видно, где ты стоишь. */
function routeHtml(t){
  const r = routeOf(t);
  if (!r) return '';
  const here = STATION_CODE[t.station];

  const items = r.stops.map(st => {
    const mine = st.code === here;
    const times = [st.arrival, st.departure].filter(Boolean).join(' — ');
    const wait = st.stop ? `<span class="stop">${st.stop} ${T[lang].min}</span>` : '';
    return `<li class="${mine ? 'here' : ''}">
      <span class="rt">${times}</span>
      <span class="rn">${st.title}</span>${wait}</li>`;
  }).join('');

  const cut = (r.cut_before + r.cut_after)
    ? `<div class="cut">${T[lang].abroad}</div>` : '';
  return `<ol class="route">${items}</ol>${cut}`;
}

function trainTitle(t){
  if (lang === 'ru' || !t.cities || !t.cities.length) return t.title;
  const names = t.cities
    .map((c, i) => withQual(cityName(c), (t.quals || [])[i]))
    .join(' — ');
  return t.direction === 'arrival' ? T[lang].from(names) : names;
}

function render(){
  const board = document.getElementById('board');
  if (!DATA){ return; }

  const list = upcoming(DATA.trains, mode);
  board.innerHTML = '';

  if (!list.length){
    board.innerHTML = `<div class="empty">${T[lang].empty}</div>`;
    return;
  }

  for (const t of list){
    const c = countdownText(t.at);
    const key = t.number + t.time_local + t.direction;
    const open = openRow === key;

    const row = document.createElement('div');
    row.className = 'row' + (open ? ' open' : '');
    if (routeOf(t)) {
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-expanded', open);
      const toggle = () => { openRow = open ? null : key; render(); };
      row.onclick = toggle;
      row.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      };
    }
    row.innerHTML = `
      <div class="num">${t.number}</div>
      <div>
        <div class="dest">${t.brand ? `<span class="brand${t.fast?' fast':''}">${t.brand}</span>` : ''}${trainTitle(t)}</div>
        <div class="meta"><span class="st-tag">${stationName(t.station)}${t.through ? ' · ' + T[lang].through : ''}</span>${t.tomorrow ? ` · <b>${T[lang].tomorrow}</b>` : ''}</div>
      </div>
      ${t.at <= 60 ? `<div class="rail${c.soon?' soon':''}" style="width:${Math.max(3, 100 - t.at * 100 / 60)}%"></div>` : ''}
      <div class="right">
        <div class="time">${t.time_local}</div>
        <div class="in${c.soon?' soon':''}">${T[lang].inPrefix} <b>${c.text}</b></div>
        ${(() => {
          const l = liveOf(t);
          if (!l) return '';
          const dev = l.deviation
            ? `<div class="dev">${l.deviation > 0 ? '+' : ''}${l.deviation} ${T[lang].min}</div>`
            : '';
          const pf = l.platform
            ? `<div class="platform">${T[lang].track} ${l.platform}</div>`
            : '';
          return dev + pf;
        })()}
      </div>
      ${open ? `<div class="route-wrap">${routeHtml(t)}</div>` : ''}`;
    board.appendChild(row);
  }
}

function tick(){
  const d = tashkentNow();
  document.getElementById('clock').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function load(){
  try {
    const r = await fetch('data/schedule.json', {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();

    try {
      const n = await fetch('data/names.json', {cache:'no-cache'});
      if (n.ok) NAMES = await n.json();
    } catch (e) { /* без справочника покажем русские названия */ }

    // Живое табло: платформы. Есть не для всех станций — без него
    // страница работает как раньше.
    try {
      const l = await fetch('data/live.json', {cache:'no-cache'});
      if (l.ok) LIVE = await l.json();
    } catch (e) { /* необязательный слой */ }

    try {
      const rt = await fetch('data/routes.json', {cache:'no-cache'});
      if (rt.ok) ROUTES = await rt.json();
    } catch (e) { /* без маршрутов строки просто не раскрываются */ }

    buildCityList(DATA.trains);
    city = CITIES[0];
    applyLang();
  } catch (e) {
    document.getElementById('board').innerHTML =
      `<div class="empty">${T[lang].error}</div>`;
    document.getElementById('foot').textContent = '';
  }
}

function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('btn-dep').textContent = t.dep;
  document.getElementById('btn-arr').textContent = t.arr;
  document.getElementById('tz-label').textContent = t.tz;
  // До загрузки данных города ещё нет — заголовок остаётся пустым,
  // это лучше, чем мигнуть чужим языком.
  document.getElementById('place').innerHTML = city ? cityName(city.ru) : '';
  document.querySelectorAll('#langs button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.lang === lang));
  if (DATA) setFooter();
  buildCities();
  render();
}

function buildLangs(){
  const box = document.getElementById('langs');
  box.innerHTML = '';
  [['uz','UZ'],['ru','RU'],['en','EN']].forEach(([code, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.lang = code;
    b.setAttribute('aria-pressed', code === lang);
    b.onclick = () => { lang = code; applyLang(); };
    box.appendChild(b);
  });
}

function setFooter(){
  const upd = new Date(DATA.generated_at);
  document.getElementById('foot').innerHTML =
    `${T[lang].note}<br>${T[lang].updated(upd.toLocaleDateString(lang === 'uz' ? 'uz-UZ' : lang))}`;
}

function buildCities(){
  const box = document.getElementById('cities');
  box.innerHTML = '';
  CITIES.forEach(c => {
    const b = document.createElement('button');
    b.textContent = cityName(c.ru);
    b.setAttribute('aria-pressed', city ? c.id === city.id : false);
    b.onclick = () => {
      city = c;
      document.getElementById('place').innerHTML = cityName(c.ru);
      buildCities();
      render();
    };
    box.appendChild(b);
  });
}

document.getElementById('btn-dep').onclick = () => setMode('departure');
document.getElementById('btn-arr').onclick = () => setMode('arrival');

function setMode(m){
  mode = m;
  document.getElementById('btn-dep').setAttribute('aria-pressed', m==='departure');
  document.getElementById('btn-arr').setAttribute('aria-pressed', m==='arrival');
  render();
}

buildLangs();
applyLang();          // подписи на месте до прихода данных
load();
tick();
setInterval(tick, 1000);
setInterval(render, 30000);
</script>
</body>
</html>
