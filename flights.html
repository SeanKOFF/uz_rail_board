<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tabloda.uz — Aviareyslar jadvali</title>
<meta name="description" content="O'zbekiston aeroportlari: eng yaqin reyslar, uchish va qo'nish vaqtlari, terminallar.">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#16323B">

<meta property="og:title" content="tabloda.uz — Aviareyslar jadvali">
<meta property="og:description" content="O'zbekiston aeroportlari: eng yaqin reyslar.">
<meta property="og:image" content="https://tabloda.uz/assets/og-image.png">
<meta property="og:url" content="https://tabloda.uz/flights.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Палитра та же, что на главной. Когда авиараздел устоится,
     общую часть стоит вынести в assets/common.css. */
  :root{
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ink:#16323B;
    --muted:#63797F;
    --rule:#DBE2E1;
    --tile:#1B8794;
    --saffron:#C4841F;
    --alarm:#B24A3C;
  }
  [data-theme="dark"]{
    --paper:#0E1D23;
    --card:#162C34;
    --ink:#E6EDEB;
    --muted:#7D969D;
    --rule:#23404A;
    --tile:#37B4C1;
    --saffron:#DFA43D;
    --alarm:#D9705F;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    transition:background-color .25s, color .25s;
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    min-height:100vh;
    padding:clamp(14px,3.5vw,36px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto}

  /* ---- шапка ---- */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;padding-bottom:16px;
  }
  .brandline{display:flex;flex-direction:column;gap:8px}
  .mark{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;
    color:var(--muted);letter-spacing:-.01em;width:fit-content;
  }
  .mark b{color:var(--tile);font-weight:600}
  .mark:hover{color:var(--ink)}
  .mark img{display:block;border-radius:6px}

  .place{
    font-family:'Unbounded',sans-serif;
    font-weight:600;
    font-size:clamp(26px,6.5vw,40px);
    letter-spacing:-.02em;
    line-height:1;
  }
  .place span{color:var(--muted);font-weight:400}

  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .controls{display:flex;align-items:center;gap:8px}
  .theme{
    background:none;border:1px solid var(--rule);color:var(--muted);
    cursor:pointer;width:26px;height:26px;border-radius:50%;
    font-size:12px;line-height:1;display:grid;place-items:center;
    transition:.16s;padding:0;
  }
  .theme:hover{border-color:var(--tile);color:var(--tile)}
  .langs{display:flex;gap:2px}
  .langs button{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font:500 11px/1 'IBM Plex Sans',sans-serif;padding:6px 7px;
    border-radius:5px;text-transform:uppercase;letter-spacing:.04em;
  }
  .langs button[aria-pressed="true"]{color:var(--tile);font-weight:600}
  .langs button:hover{color:var(--ink)}
  .clock{
    font-family:'IBM Plex Mono',monospace;font-size:13px;
    color:var(--muted);display:flex;align-items:baseline;gap:7px;
  }
  .clock small{font-size:10px;font-family:'IBM Plex Sans',sans-serif}

  /* ---- переключатель разделов ---- */
  .sections{
    display:flex;gap:4px;margin-bottom:14px;
    border-bottom:1px solid var(--rule);
  }
  .sections a{
    text-decoration:none;color:var(--muted);
    font:500 13px/1 'IBM Plex Sans',sans-serif;
    padding:9px 14px;border-bottom:2px solid transparent;
    margin-bottom:-1px;transition:.16s;
  }
  .sections a:hover{color:var(--ink)}
  .sections a[aria-current="page"]{color:var(--tile);border-bottom-color:var(--tile)}

  /* ---- вылет / прилёт ---- */
  .modes{display:flex;gap:6px;margin-bottom:14px}
  .modes button{
    background:none;border:1px solid var(--rule);color:var(--muted);
    cursor:pointer;padding:8px 15px;border-radius:7px;
    font:500 13px/1 'IBM Plex Sans',sans-serif;transition:.16s;
  }
  .modes button[aria-pressed="true"]{
    background:var(--tile);border-color:var(--tile);color:#fff;
  }
  .modes button:hover:not([aria-pressed="true"]){color:var(--ink);border-color:var(--muted)}

  /* ---- выбор аэропорта ---- */
  .city-toggle{
    display:none;width:100%;background:var(--card);
    border:1px solid var(--rule);border-radius:7px;color:var(--ink);
    cursor:pointer;padding:10px 14px;margin-bottom:8px;text-align:left;
    font:500 13px/1 'IBM Plex Sans',sans-serif;
  }
  .airports{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .airports button{
    background:var(--card);border:1px solid var(--rule);color:var(--muted);
    cursor:pointer;padding:7px 12px;border-radius:6px;
    font:400 12.5px/1 'IBM Plex Sans',sans-serif;transition:.16s;
  }
  .airports button[aria-pressed="true"]{
    border-color:var(--tile);color:var(--tile);font-weight:600;
  }
  .airports button:hover:not([aria-pressed="true"]){color:var(--ink)}
  .airports button small{opacity:.6;font-size:10px;margin-left:4px}

  /* ---- табло ---- */
  .board{display:flex;flex-direction:column;gap:1px}
  .row{
    background:var(--card);border:1px solid var(--rule);
    border-radius:8px;margin-bottom:7px;padding:13px 15px;
    display:grid;grid-template-columns:auto 1fr auto;
    gap:6px 15px;align-items:baseline;cursor:pointer;transition:.16s;
  }
  .row:hover{border-color:var(--muted)}
  .row.open{border-color:var(--tile)}

  .time{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;font-weight:500;letter-spacing:-.01em;
  }
  .time s{
    display:block;font-size:12px;color:var(--muted);
    text-decoration:line-through;font-weight:400;
  }
  .time .fact{color:var(--saffron);font-weight:600}

  .dest{min-width:0}
  .dest .city{
    font-size:16px;font-weight:500;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dest .meta{
    font:400 12px/1.5 'IBM Plex Mono',monospace;color:var(--muted);
    margin-top:2px;
  }

  .right{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .in{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .in b{color:var(--tile);font-weight:600}
  .term{
    font:500 11px/1 'IBM Plex Mono',monospace;color:var(--muted);
    border:1px solid var(--rule);border-radius:4px;padding:3px 6px;
  }

  .status{
    grid-column:1/-1;font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .status::before{
    content:'';width:6px;height:6px;border-radius:50%;
    background:var(--muted);flex:none;
  }
  .status.ok::before{background:var(--tile)}
  .status.warn{color:var(--saffron)}
  .status.warn::before{background:var(--saffron)}
  .status.bad{color:var(--alarm)}
  .status.bad::before{background:var(--alarm)}

  /* ---- раскрытие ---- */
  .detail{
    grid-column:1/-1;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--rule);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px 18px;
  }
  .detail dt{
    font:400 10.5px/1 'IBM Plex Sans',sans-serif;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;
  }
  .detail dd{font-size:13.5px}

  /* ---- низ ---- */
  .note{font-size:12px;color:var(--muted);margin:16px 0 0;line-height:1.6}
  .source{font-size:12px;color:var(--muted);margin-top:14px}
  .source a{color:var(--muted)}
  footer{
    margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--muted);line-height:1.7;
  }
  .empty{
    background:var(--card);border:1px dashed var(--rule);border-radius:8px;
    padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px;
  }

  @media (max-width:600px){
    .city-toggle{display:block}
    .airports{display:none;flex-direction:column}
    .airports.open{display:flex}
    .airports button{width:100%;text-align:left}
    .row{grid-template-columns:auto 1fr;gap:5px 12px}
    .right{grid-column:2;align-items:flex-start;text-align:left;
           flex-direction:row;gap:8px;align-items:center}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brandline">
      <a class="mark" href="./" aria-label="tabloda.uz">
        <img src="assets/favicon.svg" alt="" width="26" height="26">
        <span>tabloda<b>.uz</b></span>
      </a>
      <div class="place" id="place"></div>
    </div>
    <div class="head-right">
      <div class="controls">
        <div class="langs" id="langs" role="group" aria-label="Til / Language"></div>
        <button id="theme" class="theme" type="button" aria-pressed="false"></button>
      </div>
      <div class="clock"><span id="clock">--:--:--</span><small id="tz-label"></small></div>
    </div>
  </header>

  <nav class="sections" id="sections"></nav>

  <div class="modes" role="group">
    <button id="btn-dep" aria-pressed="true"></button>
    <button id="btn-arr" aria-pressed="false"></button>
  </div>

  <button id="city-toggle" class="city-toggle" type="button"
          aria-expanded="false" aria-controls="airports"></button>
  <div class="airports" id="airports" role="group"></div>

  <div class="board" id="board"></div>

  <p class="note" id="note"></p>
  <p class="source" id="source"></p>

  <footer id="foot"></footer>

</div>

<script>
const TZ_OFFSET = 5;          // Ташкент, UTC+5, перевода часов нет
const SHOW = 12;              // сколько рейсов показываем
const HORIZON_H = 24;         // горизонт планирования — сутки

let DATA = null;              // {updated, flights:[...]}
let CITIES = {};              // IATA -> {uz, ru, en}
let STATUSES = {};            // код -> {uz, ru, en}
let mode = 'departure';
let airport = 'TAS';
let lang = 'uz';
let openRow = null;

const T = {
  uz: {
    trains:'Poyezdlar', flights:'Samolyotlar',
    dep:'Uchish', arr:'Qo\'nish', tz:'mahalliy vaqt',
    tomorrow:'ertaga', inPrefix:'', min:'daq', hr:'soat',
    now:'hozir', airport:'Aeroport',
    carrier:'Aviakompaniya', flight:'Reys', terminal:'Terminal',
    baggage:'Bagaj lentasi', checkin:'Ro\'yxatdan o\'tish',
    codeshare:'Kodsherling', scheduled:'Jadval bo\'yicha',
    empty:'Yaqin sutkada bu aeroportda reys yo\'q.',
    error:'Jadval yuklanmadi. Sahifani yangilang.',
    note:'Vaqtlar mahalliy. Ma\'lumot aeroport tablosidan olinadi va soatiga bir marta yangilanadi.',
    source:'Manba: ',
    updated:d => 'Yangilangan ' + d,
  },
  ru: {
    trains:'Поезда', flights:'Самолёты',
    dep:'Вылет', arr:'Прилёт', tz:'время местное',
    tomorrow:'завтра', inPrefix:'через', min:'мин', hr:'ч',
    now:'сейчас', airport:'Аэропорт',
    carrier:'Авиакомпания', flight:'Рейс', terminal:'Терминал',
    baggage:'Багажная лента', checkin:'Стойки регистрации',
    codeshare:'Код-шеринг', scheduled:'По расписанию',
    empty:'В ближайшие сутки рейсов из этого аэропорта нет.',
    error:'Расписание не загрузилось. Обновите страницу.',
    note:'Время местное. Данные с табло аэропортов, обновляются раз в час.',
    source:'Источник: ',
    updated:d => 'Обновлено ' + d,
  },
  en: {
    trains:'Trains', flights:'Flights',
    dep:'Departures', arr:'Arrivals', tz:'local time',
    tomorrow:'tomorrow', inPrefix:'in', min:'min', hr:'h',
    now:'now', airport:'Airport',
    carrier:'Airline', flight:'Flight', terminal:'Terminal',
    baggage:'Baggage belt', checkin:'Check-in desks',
    codeshare:'Codeshare', scheduled:'Scheduled',
    empty:'No flights from this airport within 24 hours.',
    error:'Schedule failed to load. Please refresh.',
    note:'Local time. Data from airport boards, updated hourly.',
    source:'Source: ',
    updated:d => 'Updated ' + d,
  },
};

// Порядок в списке: сначала крупные, потом вертолётные площадки.
const ORDER = ['TAS','SKD','BHK','UGC','NMA','AZN','FEG',
               'KSQ','NCU','TMJ','NVI','RBZ','OMN','IYO'];

const cityName = iata => (CITIES[iata] && CITIES[iata][lang]) || iata;

function statusText(f){
  const dict = STATUSES[f.status_code];
  if (!dict) return f.status || '';
  // У expected и delayed_until время подставляется; когда источник
  // пишет xx:xx, времени нет — берём вариант без него.
  if (f.status_time) return (dict[lang] || '').replace('{time}', f.status_time);
  const fallback = STATUSES[f.status_code + '_notime'];
  return (fallback ? fallback[lang] : dict[lang] || '').replace('{time}', '');
}

const STATUS_TONE = {
  on_time:'ok', arrived:'ok', departed:'ok',
  expected:'warn', delayed:'warn', delayed_until:'warn',
  cancelled:'bad',
};

/* ---------- время ---------- */

function nowLocal(){
  const d = new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset() * 60000) + TZ_OFFSET * 3600000);
}

const parseISO = s => s ? new Date(s) : null;

function inWords(target){
  const diff = Math.round((target - new Date()) / 60000);
  if (diff <= 0) return T[lang].now;
  if (diff < 60) return `${T[lang].inPrefix} <b>${diff}</b> ${T[lang].min}`.trim();
  const h = Math.floor(diff / 60), m = diff % 60;
  return `${T[lang].inPrefix} <b>${h}</b> ${T[lang].hr} ${m} ${T[lang].min}`.trim();
}

const hhmm = iso => iso ? iso.slice(11, 16) : '';

/* ---------- отбор ---------- */

function upcoming(){
  if (!DATA) return [];
  const now = new Date();
  const till = new Date(now.getTime() + HORIZON_H * 3600000);

  return DATA.flights
    .filter(f => f.airport === airport && f.event === mode)
    .filter(f => {
      const t = parseISO(f.estimated_at || f.scheduled_at);
      // Небольшой запас назад: только что улетевшие ещё интересны.
      return t && t > new Date(now.getTime() - 20 * 60000) && t < till;
    })
    .sort((a, b) => parseISO(a.estimated_at || a.scheduled_at)
                  - parseISO(b.estimated_at || b.scheduled_at))
    .slice(0, SHOW);
}

/* ---------- отрисовка ---------- */

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function detailHtml(f){
  const t = T[lang];
  const items = [
    [t.flight,    f.number],
    [t.carrier,   f.carrier],
    [t.terminal,  f.terminal],
    [f.event === 'departure' ? t.checkin : t.baggage, f.baggage],
    [t.codeshare, f.codeshare],
    [t.scheduled, hhmm(f.scheduled_at)],
  ].filter(([, v]) => v);
  return `<dl class="detail">${items.map(([k, v]) =>
    `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
}

function rowHtml(f, i){
  const planned = hhmm(f.scheduled_at);
  const fact = hhmm(f.estimated_at);
  const moved = fact && fact !== planned;
  const when = parseISO(f.estimated_at || f.scheduled_at);
  const tone = STATUS_TONE[f.status_code] || '';
  const open = openRow === i;

  return `
    <div class="row${open ? ' open' : ''}" data-i="${i}" role="button" tabindex="0">
      <div class="time">
        ${moved ? `<s>${planned}</s><span class="fact">${fact}</span>`
                : `<span>${planned}</span>`}
      </div>
      <div class="dest">
        <div class="city">${esc(cityName(f.city_iata) || f.city)}</div>
        <div class="meta">${esc(f.number)} · ${esc(f.carrier || '')}</div>
      </div>
      <div class="right">
        <div class="in">${inWords(when)}</div>
        ${f.terminal ? `<div class="term">${esc(f.terminal)}</div>` : ''}
      </div>
      <div class="status ${tone}">${esc(statusText(f))}</div>
      ${open ? detailHtml(f) : ''}
    </div>`;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('place').textContent = cityName(airport);

  document.getElementById('sections').innerHTML =
    `<a href="./">${t.trains}</a>
     <a href="flights.html" aria-current="page">${t.flights}</a>`;

  document.getElementById('btn-dep').textContent = t.dep;
  document.getElementById('btn-arr').textContent = t.arr;
  document.getElementById('btn-dep').setAttribute('aria-pressed', mode === 'departure');
  document.getElementById('btn-arr').setAttribute('aria-pressed', mode === 'arrival');

  document.getElementById('city-toggle').textContent = cityName(airport);
  document.getElementById('tz-label').textContent = t.tz;
  document.getElementById('note').textContent = t.note;
  document.getElementById('source').innerHTML = t.source +
    '<a href="https://uzairports.com/" target="_blank" rel="noopener">uzairports.com</a>';

  document.getElementById('airports').innerHTML = ORDER.map(code =>
    `<button data-code="${code}" aria-pressed="${code === airport}">${esc(cityName(code))}</button>`
  ).join('');

  const list = upcoming();
  document.getElementById('board').innerHTML = list.length
    ? list.map(rowHtml).join('')
    : `<div class="empty">${t.empty}</div>`;

  document.getElementById('foot').textContent = DATA
    ? t.updated(new Date(DATA.updated).toLocaleString(
        lang === 'en' ? 'en-GB' : lang === 'ru' ? 'ru-RU' : 'uz-UZ',
        {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}))
    : '';
}

/* ---------- часы ---------- */

function tick(){
  const d = nowLocal();
  document.getElementById('clock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');
}

/* ---------- события ---------- */

document.getElementById('board').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const i = +row.dataset.i;
  openRow = openRow === i ? null : i;
  render();
});

document.getElementById('board').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.row');
  if (!row) return;
  e.preventDefault();
  const i = +row.dataset.i;
  openRow = openRow === i ? null : i;
  render();
});

document.getElementById('airports').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  airport = b.dataset.code;
  openRow = null;
  document.getElementById('airports').classList.remove('open');
  try { localStorage.setItem('airport', airport); } catch {}
  render();
});

document.getElementById('city-toggle').addEventListener('click', () => {
  const list = document.getElementById('airports');
  const open = list.classList.toggle('open');
  document.getElementById('city-toggle').setAttribute('aria-expanded', open);
});

document.getElementById('btn-dep').addEventListener('click', () => {
  mode = 'departure'; openRow = null; render();
});
document.getElementById('btn-arr').addEventListener('click', () => {
  mode = 'arrival'; openRow = null; render();
});

/* ---------- тема и язык ---------- */

function setTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.getElementById('theme');
  b.textContent = dark ? '○' : '●';
  b.setAttribute('aria-pressed', dark);
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch {}
}

document.getElementById('theme').addEventListener('click', () => {
  setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});

document.getElementById('langs').innerHTML = ['uz','ru','en'].map(l =>
  `<button data-l="${l}" aria-pressed="${l === lang}">${l}</button>`).join('');

document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch {}
  document.querySelectorAll('#langs button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.l === lang));
  render();
});

/* ---------- запуск ---------- */

(async function init(){
  try {
    lang = localStorage.getItem('lang') || 'uz';
    airport = localStorage.getItem('airport') || 'TAS';
    setTheme(localStorage.getItem('theme') === 'dark');
  } catch {
    setTheme(false);
  }
  document.querySelectorAll('#langs button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.l === lang));

  tick();
  setInterval(tick, 1000);
  // Раз в минуту пересчитываем «через сколько».
  setInterval(() => { if (DATA) render(); }, 60000);

  try {
    const [flights, cities, statuses] = await Promise.all([
      fetch('data/flights_live.json').then(r => r.json()),
      fetch('cities.json').then(r => r.json()),
      fetch('statuses.json').then(r => r.json()),
    ]);
    DATA = flights;
    CITIES = cities;
    STATUSES = statuses;
    render();
  } catch (err) {
    document.getElementById('board').innerHTML =
      `<div class="empty">${T[lang].error}</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
