name: Места в поездах — наблюдение

on:
  schedule:
    # Каждые 20 минут: :02, :22, :42. Занято: ЖД-табло — 7-я, автобусы — 17-я
    # (раз в 3 часа), аэропорты — 27-я, электрички — 47-я; группа data-write
    # общая. Прогон ~4 минуты, поэтому успевает до соседей.
    - cron: '2,22,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  seats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Зависимостей нет: seats_watch.py на стандартной библиотеке.

      - name: Снять места
        run: |
          set -o pipefail
          python seats_watch.py | tee seats.log

      - name: Вынести ошибки в аннотации
        if: always()
        run: |
          grep -E '^ *✗' seats.log | sed -E 's/^ *✗ /::error title=Места::/' || true

      - name: Зафиксировать
        run: |
          if [[ -n "$(git status --porcelain data/seats_state.json data/seats_log.jsonl)" ]]; then
            git config user.name  "schedule-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/seats_state.json data/seats_log.jsonl
            git commit -m "Места: $(date -u '+%d.%m %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Изменений нет."
          fi

      - name: Отчёт
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat seats.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "нет вывода" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
