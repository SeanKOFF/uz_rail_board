name: Автобусы — наблюдение

on:
  schedule:
    # Каждые 3 часа на 17-й минуте. Занято: ЖД-табло — 7-я, аэропорты — 27-я,
    # электрички — 47-я; группа data-write общая.
    # Время UTC: в Ташкенте это 02:17, 05:17, 08:17 и так далее.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  buses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Зависимостей нет: buses_watch.py на стандартной библиотеке.

      - name: Снять автобусы
        run: |
          set -o pipefail
          python buses_watch.py | tee buses.log

      - name: Вынести ошибки в аннотации
        if: always()
        run: |
          grep -E '^ *✗' buses.log | sed -E 's/^ *✗ /::error title=Автобусы::/' || true

      - name: Зафиксировать
        run: |
          if [[ -n "$(git status --porcelain data/buses_state.json data/buses_log.jsonl)" ]]; then
            git config user.name  "schedule-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/buses_state.json data/buses_log.jsonl
            git commit -m "Автобусы: $(date -u '+%d.%m %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Изменений нет."
          fi

      - name: Отчёт
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat buses.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "нет вывода" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
