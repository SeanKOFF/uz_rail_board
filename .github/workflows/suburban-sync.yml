name: Электрички — ежечасно

on:
  schedule:
    # 47-я минута: ЖД-табло на 7-й, аэропорты на 27-й, группа общая.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  suburban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Зависимостей нет: elektropoyezd.py на стандартной библиотеке.

      - name: Снять расписание электричек
        run: |
          set -o pipefail
          python elektropoyezd.py | tee suburban.log

      - name: Вынести отмены в аннотации
        # Отмены и пустые маршруты видны прямо на странице запуска,
        # без раскрытия лога.
        if: always()
        run: |
          grep -E '^ *✗' suburban.log | sed -E 's/^ *✗ (\[)/::warning title=Электрички::\1/; s/^✗ /::error title=Электрички::/' || true

      - name: Зафиксировать
        run: |
          if [[ -n "$(git status --porcelain data/suburban.json)" ]]; then
            git config user.name  "schedule-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/suburban.json
            git commit -m "Электрички: $(date -u '+%d.%m %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Изменений нет."
          fi

      - name: Отчёт
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat suburban.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "нет вывода" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
