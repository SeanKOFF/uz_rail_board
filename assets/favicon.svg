<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tabloda">
  <!-- Створка перекидного табло: скруглённый квадрат с горизонтальным
       швом посередине. Читается уже с 16 пикселей. -->
  <rect width="64" height="64" rx="14" fill="#16323B"/>

  <!-- Верхняя половина створки чуть светлее — как отражение света -->
  <path d="M14 14h36v16H14z" fill="#1B8794"/>
  <!-- Нижняя половина темнее -->
  <path d="M14 34h36v16H14z" fill="#1B8794" opacity=".55"/>

  <!-- Шов: щель между створками -->
  <rect x="12" y="30.5" width="40" height="3" fill="#16323B"/>

  <!-- Точка ближайшего отправления -->
  <circle cx="46" cy="42" r="4" fill="#C4841F"/>
</svg>
